name: windows-install-validation
on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run Megamind setup end-to-end (real Windows, pinned WanGP)
        shell: cmd
        run: cmd /c setup_megamind_windows.bat < nul

      - name: Verify install artifacts
        shell: cmd
        run: |
          if not exist Wan2GP\venv\Scripts\python.exe (echo MISSING venv & exit /b 1)
          if not exist Wan2GP\wgp_config.json (echo MISSING config & exit /b 1)
          if not exist Wan2GP\run_megamind_windows.bat (echo MISSING run bat & exit /b 1)
          findstr /C:"\"megamind\"" Wan2GP\wgp_config.json >nul || (echo config not megamind & exit /b 1)

      - name: Verify Megamind patch content
        shell: cmd
        run: |
          findstr /C:"Megamind Studios" Wan2GP\wgp.py >nul || (echo header patch missing & exit /b 1)
          if not exist Wan2GP\shared\gradio\ui_studio_megamind.css (echo MISSING theme css & exit /b 1)
          Wan2GP\venv\Scripts\python.exe Wan2GP\megamind\curate_models.py

      - name: Verify curated model count
        shell: cmd
        run: |
          Wan2GP\venv\Scripts\python.exe -c "import glob,os; n=len([f for f in glob.glob(r'Wan2GP/finetunes/*.json')]); print(n, 'hiding stubs'); assert n >= 260, n"
