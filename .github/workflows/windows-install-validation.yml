name: windows-install-validation
on:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run Megamind setup end-to-end (real Windows, pinned WanGP)
        shell: cmd
        run: cmd /c setup_megamind_windows.bat < nul

      - name: Verify install artifacts
        shell: cmd
        run: |
          if not exist Wan2GP\venv\Scripts\python.exe (echo MISSING venv & exit /b 1)
          if not exist Wan2GP\wgp_config.json (echo MISSING config & exit /b 1)
          if not exist Wan2GP\run_megamind_windows.bat (echo MISSING run bat & exit /b 1)
          findstr /C:"\"megamind\"" Wan2GP\wgp_config.json >nul || (echo megamind plugin not enabled in config & exit /b 1)

      - name: Verify Megamind add-on content
        shell: cmd
        run: |
          if not exist Wan2GP\plugins\megamind\plugin.py (echo MISSING branding plugin & exit /b 1)
          if not exist Wan2GP\plugins\megamind\plugin_info.json (echo MISSING plugin info & exit /b 1)
          if exist Wan2GP\shared\gradio\ui_studio_megamind.css (echo STALE theme css present & exit /b 1)
          Wan2GP\venv\Scripts\python.exe Wan2GP\megamind\curate_models.py

      - name: Verify curated model count
        shell: cmd
        run: |
          Wan2GP\venv\Scripts\python.exe -c "import glob; n=len(glob.glob(r'Wan2GP/finetunes/*.json')); print(n, 'hiding stubs'); assert n >= 260, n"

      - name: Verify launcher content and line-ending safety
        shell: pwsh
        run: |
          $raw = Get-Content -Raw Wan2GP\run_megamind_windows.bat
          if ($raw -notmatch "Setup not done yet") { Write-Host "launcher missing setup guard"; exit 1 }
          $lines = Get-Content Wan2GP\run_megamind_windows.bat
          $bad = $lines | Where-Object { $_ -match '^\s*\)' -or $_ -match '^\s*goto |^\s*:[A-Za-z]' }
          if ($bad) { Write-Host "launcher has line-ending-fragile constructs:"; $bad; exit 1 }
          Write-Host "launcher guard + line-ending-safe construction OK"

      - name: Dependency import smoke (torch stack; torchcodec intentionally absent)
        shell: cmd
        run: |
          Wan2GP\venv\Scripts\python.exe -c "import torch, torchvision, torchaudio; print('torch', torch.__version__, 'cuda_available:', torch.cuda.is_available())"
          Wan2GP\venv\Scripts\python.exe -c "import importlib.util, sys; assert importlib.util.find_spec('torchcodec') is None, 'torchcodec present but should be excluded for this profile'; print('torchcodec absent as intended (unused by WanGP at pinned commit; no Windows wheel for torch 2.7 path)')"

      - name: "App startup healthcheck (GPU-less CI - boundary classified, NOT a full-startup pass)"
        shell: pwsh
        run: |
          $env:PYTHONUNBUFFERED = "1"
          $p = Start-Process -FilePath "Wan2GP\venv\Scripts\python.exe" -ArgumentList "Wan2GP\wgp.py --server-port 7865" -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log -PassThru
          $ok = $false; $nodriver = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            if ($p.HasExited) {
              $logs = (Get-Content app-out.log, app-err.log -Raw -ErrorAction SilentlyContinue) -join "`n"
              if ($logs -match "Found no NVIDIA driver" -and $logs -match 'attention\.py", line 17' ) {
                Write-Host "::notice::GPU-less boundary (expected on CI): WanGP exits at import - upstream shared/attention.py line 17 calls torch.cuda.get_device_capability with no CUDA guard. Everything up to the hardware boundary is verified; UI startup and generation require the user's NVIDIA GPU + driver."
                $nodriver = $true
                break
              }
              Write-Host "APP EXITED EARLY code=$($p.ExitCode) - tail of logs:"
              Get-Content app-out.log, app-err.log -Tail 60 -ErrorAction SilentlyContinue
              exit 1
            }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:7865/" -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if ($ok) { Write-Host "Gradio UI responded 200 - full startup OK"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; exit 0 }
          if ($nodriver) { exit 0 }
          Get-Content app-out.log, app-err.log -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "no HTTP response after 5 min"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit 1
